---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: deployment-ls4-production-webap
  name: webap
  namespace: ls4-production
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: deployment-ls4-production-webap
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        nersc.gov/collab_uids: "103988"
        nersc.gov/gid: "63477"
        nersc.gov/gids: 63477,96414
        nersc.gov/roles: user
        nersc.gov/uid: "95089"
        nersc.gov/username: raknop
      labels:
        workload.user.cattle.io/workloadselector: deployment-ls4-production-webap
    spec:
      containers:
      - image: registry.nersc.gov/m4616/seechange-webap:20261022a
        # command: [ "tail", "-f", "/etc/issue" ]
        imagePullPolicy: IfNotPresent
        name: seechange-webap
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 95089
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
        - mountPath: /secrets
          name: webap-secrets
        - mountPath: /sessions
          name: webap-sessions
        - mountPath: /archive
          name: seechange-archive-dir
          readOnly: true
      dnsConfig: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 103988
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: registry-nersc
      volumes:
      - name: webap-secrets
        secret:
          defaultMode: 256
          optional: false
          secretName: webap-secrets
      - name: webap-sessions
        persistentVolumeClaim:
          claimName: webap-sessions-pvc
      - name: seechange-archive-dir
        hostPath:
          path: /global/cfs/cdirs/ls4/archive-ls4
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: webap
  namespace: ls4-production
spec:
  clusterIP: None
  clusterIPs:
  - None
  ports:
  - name: default
    port: 42
    protocol: TCP
    targetPort: 42
  selector:
    workload.user.cattle.io/workloadselector: deployment-ls4-production-webap
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Service
metadata:
  name: webap-ingress
  namespace: ls4-production
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    workload.user.cattle.io/workloadselector: deployment-ls4-production-webap
  sessionAffinity: None
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webap
  namespace: ls4-production
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  rules:
  - host: webap.ls4-production.production.svc.spin.nersc.org
    http:
      paths:
      - backend:
          service:
            name: webap-ingress
            port:
              number: 8080
        pathType: ImplementationSpecific
  - host: ls4-pipeline.lbl.gov
    http:
      paths:
      - backend:
          service:
            name: webap-ingress
            port:
              number: 8080
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - ls4-pipeline.lbl.gov
    secretName: ls4-production-webap-cert
---
