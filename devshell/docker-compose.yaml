services:
  make-archive-directories:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/file-archive-server:${IMGTAG:-test20261008}
    build:
      context: ../extern/file-archive-server
      args:
        UID: 0
        GID: 0
    volumes:
      - type: volume
        source: archive-storage
        target: /storage
    entrypoint: >
      bash -c
      "mkdir -p /storage/base &&
      chown ${USERID:-0}:${GROUPID:-0} /storage/base &&
      chmod a+rwx /storage/base"

  archive:
    depends_on:
      make-archive-directories:
        condition: service_completed_successfully
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/file-archive-server:${IMGTAG:-test20261008}
    build:
      context: ../extern/file-archive-server
      args:
        UID: 0
        GID: 0
    healthcheck:
      test: netcat -w 1 localhost 8080 || exit 1
      interval: 5s
      timeout: 10s
      retries: 5
    environment:
      - CONNECTOR_READ_STORAGE=/storage_ro/base
      - CONNECTOR_WRITE_STORAGE=/storage/base
    volumes:
      - type: volume
        source: archive-storage
        target: /storage
      - type: volume
        source: archive-storage
        target: /storage_ro
        read_only: true
    secrets:
      - connector_tokens
      - flask_secret_key
    user: ${USERID:-0}:${GROUPID:-0}

  postgres:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/postgres:${IMGTAG:-test20261008}
    build:
      context: ../docker/postgres
    environment:
      POSTGRES_DATA_DIR: /var/lib/postgresql/data
      POSTGRES_PASSWORD: fragile
    healthcheck:
      test: netcat -w 1 localhost 5432 || exit 1
      interval: 5s
      timeout: 10s
      retries: 5

  setuptables:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/seechange:${IMGTAG:-test20261008}
    build:
      context: ../
      dockerfile: ./docker/application/Dockerfile
      target: test_bindmount
    environment:
      SEECHANGE_CONFIG: /seechange/tests/seechange_config_test.yaml
    depends_on:
      postgres:
         condition: service_healthy
    volumes:
      - type: bind
        source: ..
        target: /seechange
    working_dir: /seechange
    user: ${USERID:-0}:${GROUPID:-0}
    entrypoint: [ "alembic", "upgrade", "head" ]

  mailhog:
    image: mailhog/mailhog:latest
    ports:
        - "${MAILHOG_PORT:-8025}:8025"

  kafka-server:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/kafka:${IMGTAG:-test20261008}
    build:
      context: ../docker/test_kafka
    environment:
      # cf: https://github.com/apache/kafka/blob/trunk/docker/examples/docker-compose-files/single-node/plaintext/docker-compose.yml
      # Generate a new CLUSTER_ID with: uuid -v4 | tr -d '-' | base64 | cut -b 1-22
      CLUSTER_ID: YzNhODEyOGIxMGJiNDA4M2
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-server:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-server:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: nc -w 1 localhost 9092 || exit 1
      interval: 5s
      timeout: 10s
      retries: 10

  webap:
    depends_on:
      setuptables:
        condition: service_completed_successfully
      make-archive-directories:
        condition: service_completed_successfully
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/seechange-webap:${IMGTAG:-test20261008}
    build:
      context: ../
      dockerfile: ./docker/application/Dockerfile
      target: webap
      args:
        WEBAP_CONFIG: /webap_config_file/webap_config.yaml
    user: ${USERID:-0}:${GROUPID:-0}
    ports:
      - "${WEBAP_PORT:-8081}:8081"
    healthcheck:
      test: netcat -w 1 localhost 8081
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - type: volume
        source: archive-storage
        target: /archive-storage
      - type: volume
        source: webap-sessions
        target: /sessions
      - type: bind
        source: ./webap_config_file
        target: /webap_config_file
    entrypoint: [ "./run_webap.sh", "8081", "1" ]
    # entrypoint: [ "tail", "-f", "/etc/issue" ]

  runtests:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/seechange:${IMGTAG:-test20261008}
    build:
      context: ../
      dockerfile: ./docker/application/Dockerfile
      target: test_bindmount
    environment:
      SEECHANGE_CONFIG: /seechange/tests/seechange_config_test.yaml
      SEECHANGE_TEST_ARCHIVE_DIR: /archive_storage/base
      RUN_SLOW_TESTS: 1
    depends_on:
      setuptables:
        condition: service_completed_successfully
      archive:
        condition: service_healthy
      webap:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ..
        target: /seechange
      - type: volume
        source: archive-storage
        target: /archive_storage
    working_dir: /seechange
    user: ${USERID:-0}:${GROUPID:-0}
    entrypoint: "pytest -v /seechange/$TEST_SUBFOLDER"

  runalltests:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/seechange:${IMGTAG:-test20261008}
    build:
      context: ../
      dockerfile: ./docker/application/Dockerfile
      target: test_bindmount
    environment:
      SEECHANGE_CONFIG: /seechange/tests/seechange_config_test.yaml
      SEECHANGE_TEST_ARCHIVE_DIR: /archive_storage/base
      RUN_SLOW_TESTS: 1
    depends_on:
      setuptables:
        condition: service_completed_successfully
      archive:
        condition: service_healthy
      webap:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ..
        target: /seechange
      - type: volume
        source: archive-storage
        target: /archive_storage
    working_dir: /seechange
    user: ${USERID:-0}:${GROUPID:-0}
    entrypoint: "pytest -v /seechange/tests"

  runruff:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/seechange:${IMGTAG:-test20261008}
    build:
      context: ../
      dockerfile: ./docker/application/Dockerfile
      target: test_bindmount
    volumes:
      - type: bind
        source: ..
        target: /seechange
      - type: volume
        source: archive-storage
        target: /archive_storage
    working_dir: /seechange
    user: ${USERID:-0}:${GROUPID:-0}
    entrypoint: [ "ruff", "check" ]


  shell:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/seechange:${IMGTAG:-test20261008}
    build:
      context: ../
      dockerfile: ./docker/application/Dockerfile
      target: test_bindmount
    environment:
      SEECHANGE_CONFIG: /seechange/tests/seechange_config_test.yaml
      SEECHANGE_TEST_ARCHIVE_DIR: /archive_storage/base
      TEST_DOWNLOAD_URL: null
    depends_on:
      setuptables:
        condition: service_completed_successfully
      archive:
        condition: service_healthy
      webap:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ..
        target: /seechange
      - type: volume
        source: archive-storage
        target: /archive_storage
      # ****
      # - type: bind
      #   source: /data/rknop/
      #   target: /rknop_data_dir
      # ****
    working_dir: /seechange
    user: ${USERID:-0}:${GROUPID:-0}
    entrypoint: [ "tail", "-f", "/etc/issue" ]


  justshell:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-c3-time-domain}/seechange:${IMGTAG:-test20261008}
    build:
      context: ../
      dockerfile: ./docker/application/Dockerfile
      target: test_bindmount
    environment:
      SEECHANGE_CONFIG: /seechange/tests/seechange_config_test.yaml
      SEECHANGE_TEST_ARCHIVE_DIR: /archive_storage/base
    depends_on:
      postgres:
         condition: service_healthy
    volumes:
      - type: bind
        source: ..
        target: /seechange
      - type: volume
        source: archive-storage
        target: /archive_storage
    working_dir: /seechange
    user: ${USERID:-0}:${GROUPID:-0}
    entrypoint: [ "tail", "-f", "/etc/issue" ]


secrets:
  connector_tokens:
    file: connector_tokens.txt
  flask_secret_key:
    file: flask_secret_key.txt

volumes:
  archive-storage:
  webap-sessions:
