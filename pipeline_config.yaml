# This is the default pipeline file.  This file configures what the
# pipelien does.  If multiple clusters are working onthe same sruvey,
# this file should be copied verbatim between the different clutser.
#
# This filehas values for the extraglactic
# fields.  For galactic fields, some stuff may be overridden

overrides:
  - pipeline_config_local.yaml

storage:
  images:
    format: fits
    single_file: false
    name_convention: "{ra_int:03d}/{inst_name}_{date}_{time}_{section_id}_{filter}_{im_type}_{prov_hash:.6s}"

  # Note that the exposure name_convention below is not the actual
  #   default in the code, but is the default I wish was in the code.
  # exposures:
  #   name_convention: "{inst_name}/exposures/{date}/{inst_name}_{date}_{time}_{prov_hash:.6s}"


# ======================================================================
# Database config
#
# engine MUST be psotgresql+psycopg; anything else will generate an error
#
# The basic databse connection inf is not in site config because every
# cluster working on the same survey needs to contact the same database.
#
# There is further configuration for database behavior in site_config.yaml.

db:
  engine: postgresql+psycopg
  user: postgres
  password: fragile
  password_file: null
  host: postgres
  port: 5432
  database: seechange
  echoqueries: false
  alwaysexplain: false
  alwaysanalyze: false


# ======================================================================
# Conductor
#
# The conductor is the service (running on the seechange webap) that the
# pipeline uses to figure out what exposures are available and need
# processing.
#
# Again, not in survey, because every cluster working on the same survey
# needs to contact the same conductor.  (Indeed, that's part of the
# whole POINT of the conductor.)
#
# (There will be other values set in a config file used by the actual
# conductor.)
#
#   conductor_url: string
#     The default value here is what we use in our test environment.
#     It's almost certainly wrong for any production config.
#
#   username: string
#     The username for authentication on the conductor.
#
#   password: string
#     The password for authentication on the conductor.
#
#   password_file: string
#     A file containing the password for authentication on the
#     conductor.  Set password to null and then set this if
#     you have a secure "secrets" directory where you keep passwords,
#     so that you don't have to put the password in an actual
#     config file that might be publicly readable or that might
#     get committed to a git archive.

conductor:
  conductor_url: https://webap:8081/
  username: unknown
  password: null
  password_file: null


# ======================================================================
# Webap
#
# This config is not used by the main pipeline, only the webap.
# When building the Dockerfile, those configs will be set from
# webap/seechange_webap.yaml and webap/local_overrides.yaml
# (though they include this file)

webap:
  webap_url: https://webap:8081/


# ======================================================================
# Gaia DR3 server
#
# Gaia stars are used for both astrometric and photometric
# calibration.  (As this is a discovery pipeline, we don't
# promise photometric calibration to better than a few %.)
#
# There are two ways we can get it : through the server defined in the
#  submodule extern/nersc-desi-gaia-dr3-server, and via NOIRLab
#  using their queryClient.
#
#   use_server: bool
#      If true, use the custom gaia server.
#
#   server_url: string
#      The url of the custom server
#
#   fallback_datalab: bool
#      If use_server is False, or if user_server is True and the custom
#      server is unavailable or fails after five tries, then try falling
#      back to the NOIRLab server if fallback_datalab is True.

catalog_gaiadr3:
  use_server: True
  fallback_datalab: False
  server_url: https://ls4-gaia-dr3.lbl.gov
  server_timeout_sec: 5.
  coord_round: 0.005
  mag_round: 0.1


# ======================================================================
# ======================================================================
# ======================================================================
# Pipeline components
#

# ======================================================================
# Bias and Flat Builder
#
# The things in the flat. and bias. subtress will oveerride the thing
#   in the parent subtree at runtime based on the runtime value of
#   is_flat (which is probably passed as a function argument)

flat_bias_builder:
  exposure_mode: false
  exposure_mode_use_images: false
  ok_if_num_files_per_section_mismatch: false
  filter: null
  section_id: null
  is_flat: False
  numproc: 12
  numwriteproc: 6
  timeout: null
  images: null
  image_list_file: null
  image_list_annotation: null
  instrument: null
  find_images: true
  find_provenance_id: null
  find_provenance_tag: null
  mjd: null
  timewindow: 1.0
  searchtype: Bias
  savetype: ComBias
  flat_type: null
  minexptime: 0.
  maxexptime: 0.1
  dup_reject: null
  combine_mode: median
  normalize_mode: null
  use_instrument_mask: False
  bad_threshold: 5.0
  nmin: 7
  nmax: 21
  save_to_db: True
  no_save_on_exception: True
  calibrator_set: nightly
  name_convention: "{inst_name}/biases/{date}/{inst_name}_{im_type}_{date}_{time}_{section_id}_{prov_hash:.6s}"
  validity_start_offset: 1.0
  validity_end_offset: 2.0
  bias: { }
  flat:
    searchtype: TwiFlat
    savetype: ComTwiFlat
    flat_type: twilight
    minexptime: 5.
    maxexptime: null
    dup_reject: 0.03
    combine_mode: median
    normalize_mode: median
    use_instrument_mask: True
    bad_threshold: 5.0
    nmin: 21
    nmax: 61
    name_convention: "{inst_name}/flats/{date}/{inst_name}_{im_type}_{date}_{time}_{section_id}_{prov_hash:.6s}"
#   flat:
#     exposure_mode: False
#     searchtype: Sci
#     savetype: ComSkyFlat
#     flat_type: sky
#     minexptime: 5.
#     maxexptime: null
#     dup_reject: 0.03
#     combine_mode: median
#     normalize_mode: median
#     bad_threshold: 5.0
#     # Need lots of flats for a night-sky flat to look good, but too many is slow and will run out of memory
#     nmin: 71
#     nmax: 121
#     name_convention: "{inst_name}/flats/{date}/{inst_name}_twiflat_{date}_{time}_{section_id}_{prov_hash:.6s}"



# ======================================================================
# Overall pipeline
#
# For additional documentation on the parameters, see the Parameters
# subclass in the file that defines each part of the pipeline
#
# provenance_tag: string
#    The ProvenanceTag that products of the pipeline should be
#    associated with
#
# inject_fake : boolean
#
# THE FOLLOWING THINGS ARE USUALLY CONFIGURED IN site_config.yaml
#
# save_before_subtraction : bool
#    If true, save images and data products after
#    initial reduction but before the pipeline looks for a reference
#    to make a subtraction
#
# save_at_finish : bool
#    Save everything at the end of the pipeline run.
#

pipeline:
  provenance_tag: current_exgal
  inject_fakes: false


# ======================================================================
# Preprocessing
#
# steps_required : list of str
#    Steps that must be done on the image.  Either they come with all
#    these steps done, or we must perform them.  (If they come with all
#    steps done, the ideally the pipeline will flag them as such when
#    ingesting them and won't incorrectly do something twice.)

preprocessing:
  steps_required: [ 'overscan', 'linearity', 'flat', 'fringe' ]
  calibset: externally_supplied
  overscan_method: median
  overscan_kwargs: {}
  zero_provtag: null
  flattype: externally_supplied
  flat_provtag: null
  fringe_provtag: null
  use_base_mask: true
  use_zero_mask: true
  use_flat_mask: true
  masked_pixels_to_replace: []
  masked_pixel_replacement: {}


# ======================================================================
# Extraction, Backgrounding, and PSF are done in one step.
#
# (Reason: For background, you might want to find sources to mask them
#  for finding the background.  Or, you might want to subtract the
#  background before finding sources.  Or you might want to iterate back
#  and forth.  For psf, there's always an iterative thing: find sources
#  so we have something to get the psf from, and then redo the find
#  sources and photometry once we have a psf estimate.)
#
# NOTE : because of the way the parameters in detection.py are defined,
#   make sure that *all* of the possibilities for background and psf
#   are listed here in this default_config.yaml file, or the the values
#   will get lost.
#
# ANOTHER NOTE : there is one value (a timeout) configured in
# site_config.yaml; that's there because the value you want
# for it might depend on the speed of your cluster's CPU and IO.

extraction:
  subconfigs:
    choice_algorithm: star_density
    choice_params:
      star_mag_cutoff: 20
      star_density_cutoff: 1.0e+5
    default_subconfig: extragalactic
    subconfigs:
      extragalactic:
        method: sextractor
        measure_psf: true
        apertures: [1.0, 2.0, 3.0, 5.0]
        inf_aper_num: -1
        best_aper_num: 0
        aperunit: fwhm
        separation_fwhm: 1.0
        initial_threshold: 1.5
        sextr_threshold: 1.5
        snr_threshold: 3.0
        subtraction: false
        backgrounding:
          format: map
          method: sep
          poly_order: 1
          box_size: null
          filt_size: null
        psf_method: psfex
        psf_params:
          fwhm_min: 0.5
          fwhm_max_to_try: [ 10.0, 15.0, 20.0, 25.0 ]
          psf_init_size: 25
          psf_final_size: null
      galactic:
        snr_threshold: 10.0


# ======================================================================
# World Coordinates

astrocal:
  subconfigs:
    choice_algorithm: star_density
    choice_params:
      star_mag_cutoff: 20
      star_density_cutoff: 1.0e+5
    default_subconfig: extragalactic
    subconfigs:
      extragalactic:
        cross_match_catalog: gaia_dr3
        solution_method: scamp
        max_catalog_mag: [22.0]
        mag_range_catalog: 6.0
        min_catalog_stars: 50
        max_sources_to_use: [2000, 1000, 500, 200]
      galactic:
        max_catalog_mag: [15., 16., 17.]
        mag_range_catalog: 2.0

# ======================================================================
# Zero Point

photocal:
  subconfigs:
    choice_algorithm: star_density
    choice_params:
      star_mag_cutoff: 20
      star_density_cutoff: 1.0e+5
    default_subconfig: extragalactic
    subconfigs:
      extragalactic:
        cross_match_catalog: gaia_dr3
        max_catalog_mag: [22.0]
        mag_range_catalog: 6.0
        min_catalog_stars: 50
      galactic:
        max_catalog_mag: [17., 18., 19.]
        mag_range_catalog: 3.0


# ======================================================================
# Subtraction
#
# (The pipeline will also do reference finding, but the config for
# that is further down.)
#
# refset:
#    "set refset to null to only make references (no subtraction will
#     happen to start running subtractions, first make a ref set and use
#     the name of than. in this field." <-- TODO look a this comment.
#     It seems odd.  Look at the code, and see if this is really the
#     behavior.  It seems like weird behavior.  Better would be to add a
#     "steptotodo" parameter to the overall pipeline above.  Reference
#     generation should have its own executable, not be a side effect of
#     non-obvious parameter settings in the subtraction/discvoery
#     pipeline.

subtraction:
  method: zogy
  refset: null
  alignment_index: new
  alignment:
    method: swarp
  reference:
    search_by: image
    match_instrument: true
    match_filter: true
    min_overlap: 0.85
    max_dist: null
    skip_bad: true
    multiple_ok: true
    choice_criteria: [ 'overlap' ]

# ======================================================================#
# Detection
#
# Finding sources on difference images
#
# subtraction : bool
#    This should always be true, because in the nomenclature of this
#    pipeline, "detection" is what we run on a difference images, and
#    "extraction" is what we run on science images, even though the
#    actual code run in both cases may well be the same.
#
# method : str
#    For the ZOGY subtraction method, the detection method must be
#    filter.  For the hotpants method, the detection method must be
#    sextractor.
#
# See pipline/subtraction.py for parameter definitions

detection:
  # subtraction to be out here as well as inside the subconfigs
  #   because of a quirk in detection.py
  subtraction: true
  subconfigs:
    choice_algorithm: star_density
    choice_params:
      star_mag_cutoff: 20
      star_density_cutoff: 1.0e+5
    default_subconfig: extragalactic
    subconfigs:
      extragalactic:
        method: filter
        measure_psf: false
        psf_method: psfex
        psf_params: { }
        apers: [ 1.0, 2.0, 3.0, 5.0 ]
        inf_aper_num: -1
        best_aper_num: 0
        aperunit: fvwm
        separation_fwhms: 1.0
        initial_threshold: 1.5
        sextr_threshold: 1.5
        snr_threshold: 5.0
        subtraction: true
        sextractor_back_type: MANUAL
        sextractor_back_value: 0.
        sextractor_back_size: null
        sextractor_back_filtersize: null
        backgrounding:
          format: scalar
          method: zero
      galactic:
        snr_threshold: 10.0


# ======================================================================#
# Cutting
#
# Making new, ref, sub thumbnail cutouts.
#
# The RBbot models we're using have a predetermined cutout size, which
# must match what's done here.  The models we're using now require a
# 41×41 cutout.

cutting:
  cutout_size: 41

# ======================================================================
# Measuring
#
# Measuring fluxes and positions of detections, as well as making
# analytical cuts.
#
# If you want (for testing purposes) to have all measurements
# saved regardless of whether they're good or not, set all
# the deletion thresholds to null.  (A few measurements will
# still get filtered out, if most of the pixels in the region
# of the source is masked.)
#
# See pipeline/measuring.py for definition of the parameters
#
# Legacy Survey Object Matching:
#
# Legacy Survey objects are matched to a catalog built as described in
# Liu et al., 2025, https://ui.adsabs.harvard.edu/abs/2025arXiv250517174L/abstract
# (submitted to PASP).
#
# liumatch_radius is the radius in arcseconds to find legacy survey objects

measuring:
  annulus_radii: [ 4., 5. ]
  annulus_units: fwhm
  use_annulus_bg_on_sub: False
  diag_box_halfsize: 2.
  diag_box_halfsize_unit: fwhm
  negatives_n_sigma_outlier: 3.
  bad_thresholds:
    sn: 5
    psf_fit_flags_bitmask: 0x2e
    detection_dist: 5.
    gaussfit_dist: 5.
    elongation: 3.
    width_ratio: 2.
    nbadpix: 1
    negfrac: 0.3
    negfluxfrac: 0.3
  deletion_thresholds:
    sn: 5
    psf_fit_flags_bitmask: 0x2e
    detection_dist: 5.
    gaussfit_dist: 5.
    elongation: 3.
    width_ratio: 2.
    nbadpix: 1
    negfrac: 0.3
    negfluxfrac: 0.3
    # sn: null
    # psf_fit_flags_bitmask: null
    # detection_dist: null
    # gaussfit_dist: null
    # elongation: null
    # width_ratio: null
    # nbadpix: null
    # negfrac: null
    # negfluxfrac: null
  association_radius: 2.0
  do_not_associate: False
  do_liumatch: True
  liumatch_radius: 10
  liumatch_server: https://ls-xgboost.lbl.gov
  do_gaiamatch: True
  gaiamatch_radius: 5

# ======================================================================
# Scoring
#
# This is for "deep scoring", i.e. (probably) deep learning methods for
# assigning an empirical score to the cutouts.
#
# Note: there is one config value in site_config

scoring:
  algorithm: RBbot-quiet-shadow-131-cut0.55

# ======================================================================
# Object configuration
#
# namefmt = format string for names

object:
  namefmt: obj%Y%a

# ======================================================================
# Fake injection

fakeinjection:
  subconfigs:
    choice_algorithm: star_density
    choice_params:
      star_mag_cutoff: 20
      star_density_cutoff: 1.0e+5
    default_subconfig: extragalactic
    subconfigs:
      extragalactic:
        min_fake_mag: -2.
        max_fake_mag: 1.
        mag_rel_limmag: true
        num_fakes: 100
        mag_prob_ratio: 1.
        random_seed: 0
        hostless_frac: 1.
        host_minmag: -3.
        host_maxmag: 0.5
        host_distscale: 1.
      galactic:
        min_fake_mag: -4.
        num_fakes: 400
        host_maxmag: 1.
        host_distcale: 0.


# ======================================================================
# ======================================================================
# ======================================================================
# Coaddition pipeline
#
# pipeline:
#   date_range: number of days before end date to set the start date
#               when searching for images to caodd.  (TODO : is this used???)
#
# coaddition: see pipeline/coaddition.py
#
# extraction: These parameters override the extraction parameters
#             set above.  If nothing is here, then that
#             config will be used as is.


coaddition:
  pipeline: {}
  coaddition:
    method: zogy
    noise_estimator: sep
    flag_fwhm_factor: 1.0
    alignment_index: last
    alignment:
      method: swarp
    inpainting:
      multi_image_method: median
      feather_width: 2
      rescale_method: median
      single_image_method: biharmonic
      ignore_flags: 0
  extraction:
    measure_psf: true
    initial_threshold: 1.5
    sextr_threshold: 3.0
    snr_threshold: 3.0
    method: sextractor
  backgrounding:
    format: map
    method: sep
  astrocal:
    cross_match_catalog: gaia_dr3
    solution_method: scamp
    max_catalog_mag: [22.0]
    mag_range_catalog: 6.0
    min_catalog_stars: 50
  photocal:
    cross_match_catalog: gaia_dr3
    max_catalog_mag: [22.0]
    mag_range_catalog: 6.0
    min_catalog_stars: 50

# ======================================================================
# ======================================================================
# ======================================================================
# Reference making


# use these parameters to make references by coadding images
# the reference pipeline will load the regular configuration first,
# then the coaddition config, and only in the end, override with this:
referencing:
  maker:  # these handles the top level configuration (e.g., how to choose images that go into the reference maker)
    name: best_references  # the name of the reference set that you want to make references for
    ignore_config_use_config_from_refset: false
    refset_must_already_exist: false
    description: "The Best References"   # Description of the reference set
    start_time: null  # only grab images after this time
    end_time: null  # only grab images before this time
    instrument: null  # only grab images from this instrument (if list, will make cross-instrument references)
    # filter: null  # only grab images with this filter
    project: null  # only grab images with this project
    min_airmass: null  # only grab images with airmass above this
    max_airmass: null  # only grab images with airmass below this
    min_background: null  # only grab images with background rms above this
    min_background_by_filter: {}
    max_background: null  # only grab images with background rms below this
    max_background_by_filter: {}
    min_seeing: null  # only grab images with seeing above this
    min_seeing_by_filter: {}
    max_seeing: null  # only grab images with seeing below this
    max_seeing_by_filter: {}
    min_lim_mag: null  # only grab images with limiting magnitude above this
    min_lim_mag_by_filter: {}
    max_lim_mag: null  # only grab images with limiting magnitude below this
    max_lim_mag_by_filter: {}
    min_exp_time: null  # only grab images with exposure time above this
    max_exp_time: null  # only grab images with exposure time below this
    min_number: 7  # only create a reference if this many images can be found
    center_min_number: null  # don't demand more images at the center than anywhere else
    max_number: 30  # do not add more than this number of images to the reference
    corner_distance: 0.8  # see the docs
    overlap_fraction: 0.9
    coadd_overlap_fraction: 0.1
    seeing_quality_factor: 3.0  # linear coefficient for adding lim_mag and seeing to get the "image quality"
    save_new_refs: true  # should the new references be saved to disk and committed to the database?

  coaddition:  # override the coaddition parameters in the general "coaddition" config
    coaddition:  # override the way coadds are made, from the general "coaddition" config
      method: swarp
    extraction:  # override the coaddition/regular pipeline config, when extracting for the coadd images
      measure_psf: true
#    astrocal:  # override the regular astrometric calibration parameters and the coadd extraction parameters
#      cross_match_catalog: gaia_dr3
#      solution_method: scamp
#      max_catalog_mag: [22.0]
#      mag_range_catalog: 6.0
#      min_catalog_stars: 50
#    photocal:  # override the regular photometric calibration parameters and the coadd extraction parameters
#      cross_match_catalog: gaia_dr3
#      max_catalog_mag: [22.0]
#      mag_range_catalog: 6.0
#      min_catalog_stars: 50

# ======================================================================
# ======================================================================
# ======================================================================
# Forced photometry, used by pipeline/lightcurve.py

lightcurve:
  zp_prov: null   # This or zp_prov_tag to be non-null, either in config or at runtime
  zp_prov_tag: null
  zp_prov_tag_process: photocal
  object_position_prov: null   # If this and ..._tag are null, uses raw object position
  object_position_prov_tag: null
  object_position_prov_tag_process: positioning
  subtraction_config:
    method: zogy
    refset: null
    reference:
      search_by: ra/dec
      match_instrument: true
      match_filter: true
      min_overlap: null
      max_dist: 0.00833333   # 30¨
      skip_bad: true
      multiple_ok: false
      choice_criteria: [ 'distance', 'unconstrained' ]
    alignment:
      method: swarp
      min_matched: 10
  crop_image: [ 256, 256 ]


# ======================================================================
# ======================================================================
# ======================================================================-
# Instrument-specific calibration

# Specific configuration for specific instruments.
# Instruments should override the two defaults from
# instrument_default; they may add additional
# configuration that their code needs.

instrument_default:
  calibratorset: nightly
  flattype: sky


# DECam

# For the observatory-supplied calibrations, NOIRLab distributes them on
# a Google Drive, which is a nightmare to try to download
# programmatically.  What's more, they come in ginormous tar files,
# which are slow to process; especially for tests, where we just want to
# do a couple of chips, it's not worth the time.  So, I've untarred the
# files on the NERSC web portal to allow them to be grabbed
# individually.  These can be found on Perlmutter at
# /global/cfs/dirs/m4616/www/decam_calibration_files

DECam:
  calibratorset: externally_supplied
  flattype: externally_supplied
  calibfiles:
    mjd: 56876
    # urlbase must end in /
    urlbase: https://portal.nersc.gov/cfs/m4616/decam_calibration_files/
    linearity: DECamMasterCal_56475/linearity/linearity_table_v0.4.fits
    fringebase: DECamMasterCal_56876/fringecor/DECam_Master_20131115v1
    flatbase: DECam_domeflat/
    illuminationbase: DECamMasterCal_56876/starflat/DECam_Master_20130829v3
    bpmbase: DECamMasterCal_56876/bpm/DECam_Master_20140209v2_cd_


# LS4Cam

# This is currently in flux

LS4Cam:
  calibratorset: externally_supplied
  flattype: externally_supplied
  calibfiles:
    mjd: 61151
    # urlbase must end in /
    urlbase: https://portal.nersc.gov/cfs/m4616/LS4Cam_calibration_files/
    flatbase: 20260421/LS4Cam_flat_20260421

